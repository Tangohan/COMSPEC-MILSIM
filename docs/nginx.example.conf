# Athena / COMSPEC-MILSIM — Configuration Nginx (VPS)
#
# Domaine : athena-comspec.eu (depuis le 25/10/2026). L'ancien athena.ttrd.fr reste servi
# par le même vhost, sans redirection des API : les mods publiés avant la migration l'ont
# codé en dur. Pas-à-pas complet : docs/migration-domaine-athena-comspec.md.
#
# Stratégie : site à la racine (APP_BASE_PATH vide, root = …/public) + compatibilité
# Workshop. Les mods / DLL déjà chez les joueurs appellent
#   https://athena.ttrd.fr/public/api/…
# sans mise à jour Steam. Rewrite INTERNE (pas de 301/302) : un redirect casserait
# les POST (client-init, positions, code K).
#
# .env VPS :
#   APP_URL=https://athena-comspec.eu
#   APP_BASE_PATH=          # vide — ne pas remettre /public
#   SESSION cookie path = / (déjà en dur dans Session.php)
#
# Ne pas utiliser alias /public → filesystem public/ : SCRIPT_NAME deviendrait
# /public/index.php, PHP réactiverait le préfixe, et url() produirait
# /public/public/… (double préfixe).

server {
    listen 80;
    listen [::]:80;
    server_name athena-comspec.eu www.athena-comspec.eu athena.ttrd.fr;

    # Document root = dossier public/ du dépôt (index.php, assets/, uploads/).
    root /var/www/athena.ttrd.fr/public;
    index index.php;

    # --- Compatibilité Workshop : /public et /public/… ≡ / et /… ---
    # ^~ prime sur les location regex (css/js/jpg). Sans ça,
    # /public/uploads/*.jpg irait dans try_files $uri =404 → fichier
    # public/public/uploads/… inexistant → 404.
    # `last` ré-évalue les location : /public/api/x → /api/x → front controller.
    # Deux /public d’affilée (/public/public/api/x) : second passage puis PHP
    # (Request::normalizePathFromServer) retire tout résidu.
    location ^~ /public {
        rewrite ^/public/?$ / last;
        rewrite ^/public/(.*)$ /$1 last;
    }

    # Téléversements : aucun script exécuté sous /uploads (photos terrain, logos…).
    # Placé avant `location ~ \.php$` : nginx retient la première regex qui correspond.
    location ~* ^/uploads/.*\.(php\d?|phtml|phar|pht|phps|cgi|pl|py|sh)$ {
        deny all;
    }

    # Modules ES (.mjs) et Wasm : mime.types Ubuntu omet souvent ces extensions
    # → application/octet-stream, et le navigateur refuse alors type=module.
    # `types { }` vide + default_type force le bon Content-Type.
    # Après modification : nginx -t && systemctl reload nginx
    location ~* \.mjs$ {
        types { }
        default_type application/javascript;
        charset utf-8;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ~* \.wasm$ {
        types { }
        default_type application/wasm;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Compression : la config Ubuntu par défaut ne compresse que le HTML. Sans ces types, tailwind.css (≈250 Ko),
    # back-office-shell.css (≈100 Ko) et le dictionnaire anglais (≈270 Ko) partent bruts à chaque premier chargement.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain application/manifest+json;

    # Fichiers statiques (assets, uploads, tuiles ATAK locales)
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff2?|ttf|eot|webm|mp4|webp|woff)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Pas de $uri/ : un dossier accidentel public/atak/ ferait 301 → /atak/ puis 403
    # (autoindex off) et masquerait la route PHP /atak. Les vrais index passent par index.php.
    location / {
        try_files $uri /index.php?$query_string;
    }

    # Ceinture : même si un dossier public/atak existe encore, forcer le front controller.
    location = /atak {
        rewrite ^ /index.php?$query_string last;
    }
    location = /atak/ {
        rewrite ^ /index.php?$query_string last;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        # SCRIPT_NAME doit rester /index.php (pas /public/index.php).
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_read_timeout 60;
    }

    location ~ /\. {
        deny all;
    }
}

# HTTPS : laisser Certbot (ou équivalent) ajouter listen 443 ssl et le bloc
# certificate. Recopier location ^~ /public dans le server 443 — un vhost TLS
# sans ce bloc casse les mods en HTTPS alors que HTTP marcherait encore.
#
# Tests (DNS pas encore basculé : --resolve ou Host + IP). Jamais de 301 sur POST.
#
#   IP=72.62.22.55
#   H=athena-comspec.eu   # puis H=athena.ttrd.fr : mêmes réponses
#
#   # Racine canonique
#   curl -sI -H "Host: $H" http://$IP/ | head -n 5
#
#   # Ancienne base Workshop (même page, rewrite interne — Location: absent)
#   curl -sI -H "Host: $H" http://$IP/public | head -n 5
#   curl -sI -H "Host: $H" http://$IP/public/ | head -n 5
#
#   # Ping ATAK (GET, sans clé) — même JSON sur les deux chemins
#   curl -sS -H "Host: $H" http://$IP/api/atak/ping
#   curl -sS -H "Host: $H" http://$IP/public/api/atak/ping
#
#   # Double préfixe : ne doit PAS 404 ; PHP retire le résidu
#   curl -sS -H "Host: $H" http://$IP/public/public/api/atak/ping
#
#   # Handshake mod (POST, clé plateforme recopiée — ne pas la régénérer)
#   curl -sS -D - -o /tmp/ci.json -H "Host: $H" \
#     -H "Content-Type: application/json" \
#     -H "X-COMSPEC-KEY: $X_COMSPEC_KEY" \
#     -d '{}' \
#     http://$IP/public/api/atak/client-init
#
#   # TLS une fois le certificat en place
#   curl -sS --resolve "$H:443:$IP" https://$H/public/api/atak/ping
#
# Attendu : / et /public → 200 (HTML), SANS en-tête Location (rewrite interne).
# ping → {"ok":true,"service":"atak",…} identique sur /api et /public/api.
# client-init SANS clé (prod) → 401 JSON sur les DEUX chemins (pas 301, pas HTML).
# client-init AVEC la clé recopiée → même statut JSON sur les deux chemins
#   (200, 400 ou 403 métier — peu importe, tant que ce n’est pas 404 Nginx).
#
# Si l’app est servie dans un vrai sous-dossier métier (ex. /comspec/) — autre
# cas, rare. Alors APP_BASE_PATH=/comspec et un alias dédié ; ne pas mélanger
# avec le rewrite /public ci-dessus.
