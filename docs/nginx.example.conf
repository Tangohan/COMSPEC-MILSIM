# Athena / COMSPEC-MILSIM — Exemple de configuration Nginx
# Pour que les APIs (/api/chat, /api/atak/markers, /api/intel/photos, etc.)
# et toutes les routes PHP soient traitées, la racine doit être public/
# et les requêtes non statiques doivent être envoyées à index.php.

server {
    listen 80;
    server_name athena.ttrd.fr;
    root /chemin/vers/COMSPEC-MILSIM/public;

    index index.php;

    # Fichiers statiques (assets, uploads)
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff2?|ttf|eot)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Tout le reste → front controller PHP
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 60;
    }
}

