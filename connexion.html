<script>

function ouvrirModalRenvoyerEmail(){
    const email = document.querySelector('input[name="email"]').value;

    if(!email){
        alert("Saisir l'email avant.");
        return;
    }

    fetch('/api/authentification/renvoyer-verification-email.php',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({email:email})
    })
    .then(res=>res.json())
    .then(data=>{

        const msg=document.getElementById('renvoyer-email-message');

        msg.classList.remove('hidden');

        if(data.success){
            msg.classList.remove('text-red-600');
            msg.classList.add('text-emerald-600');
            msg.textContent=data.message || "Email envoyé.";
        }else{
            msg.classList.remove('text-emerald-600');
            msg.classList.add('text-red-600');
            msg.textContent=data.error || "Erreur.";
        }

    });

}

</script>
