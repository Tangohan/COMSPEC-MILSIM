// Caméras IP (tools/model_ip_cameras.py) : sections retexturables (camo, led, ir, dome), tête PTZ (pan, tilt).
class CfgSkeletons {
    class Default { isDiscrete=1; skeletonInherit=""; skeletonBones[]={}; };
    class comspec_cam_ptz_skel: Default { skeletonBones[]={"pan","","tilt","pan"}; };
};
class CfgModels {
    class Default { sectionsInherit=""; sections[]={}; skeletonName=""; };
    class comspec_cam_fixed: Default { sections[]={"camo","led","ir","dome"}; };
    class comspec_cam_ptz: comspec_cam_fixed {
        skeletonName="comspec_cam_ptz_skel";
        class Animations {
            // phase = cap relatif / 360 (-0.5 .. 0.5), + vers la droite ; site : 0 (repos) .. 1 (90° vers le bas)
            class pan { type="rotation"; source="pan"; selection="pan"; axis="pan_axis"; memory=1; minValue=-0.5; maxValue=0.5; angle0="rad -180"; angle1="rad 180"; };
            class tilt { type="rotation"; source="tilt"; selection="tilt"; axis="tilt_axis"; memory=1; minValue=-1; maxValue=1; angle0="rad -90"; angle1="rad 90"; };
        };
    };
    class cam_ptz_wall: comspec_cam_ptz {};
    class cam_ptz_pole: comspec_cam_ptz {};
    class cam_bullet_wall: comspec_cam_fixed {};
    class cam_bullet_ceil: comspec_cam_fixed {};
    class cam_bullet_pole: comspec_cam_fixed {};
    class cam_bullet_corner: comspec_cam_fixed {};
    class cam_thermal_wall: comspec_cam_fixed {};
    class cam_thermal_pole: comspec_cam_fixed {};
    class cam_minidome: comspec_cam_fixed {};
    class cam_minidome_wall: comspec_cam_fixed {};
    class cam_fisheye: comspec_cam_fixed {};
    class cam_tactical: comspec_cam_ptz {};
    class cam_covert: comspec_cam_fixed {};
};
