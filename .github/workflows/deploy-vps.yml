name: Deploy VPS

# Push sur main (depuis le PC) → SSH root@VPS → git pull.
# Le VPS ne pousse jamais. .env, vendor/, storage/uploads restent hors Git.
#
# Secret GitHub (Settings → Secrets and variables → Actions) :
#   VPS_SSH_KEY = clé privée dont la publique est dans /root/.ssh/authorized_keys
#
# Sur le VPS, origin en lecture seule (deploy key GitHub, comme STT) :
#   git remote set-url origin git@github.com:Tangohan/COMSPEC-MILSIM.git

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-athena-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify VPS SSH secret
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "${VPS_SSH_KEY}" ]; then
            echo "::error::Le secret GitHub VPS_SSH_KEY est absent ou vide. Ajoutez la clé privée SSH du VPS dans Settings → Secrets and variables → Actions (la clé publique doit déjà être dans /root/.ssh/authorized_keys). Ne régénérez pas les clés si une paire existe déjà. Les secrets FTP_* restants ne sont plus utilisés par ce workflow."
            exit 1
          fi

      - name: Pull on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 72.62.22.55
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 12m
          script_stop: true
          script: |
            set -euo pipefail
            cd /var/www/athena.ttrd.fr
            echo "=== git before pull ==="
            git rev-parse --abbrev-ref HEAD || true
            git status --short --branch
            echo "HEAD=$(git rev-parse HEAD)"
            git fetch origin
            echo "origin/main=$(git rev-parse origin/main)"
            git checkout main
            if ! git merge --ff-only origin/main; then
              echo "=== fast-forward refused (local divergence; no reset) ==="
              git status --short --branch
              git log --oneline --decorate -8
              echo "--- local commits not on origin/main ---"
              git log --oneline origin/main..HEAD || true
              echo "--- origin/main commits not in HEAD ---"
              git log --oneline HEAD..origin/main || true
              echo "Refusing git reset --hard. Inspect the VPS tree, then merge or stash without force-push."
              exit 1
            fi
            if [ -f deploy/vps-sparse-checkout.txt ]; then
              git sparse-checkout init --cone
              # shellcheck disable=SC2046
              git sparse-checkout set $(grep -vE '^\s*(#|$)' deploy/vps-sparse-checkout.txt | tr '\n' ' ')
            fi
            PHP_BIN="$(command -v php8.4 || command -v php)"
            COMPOSER_BIN="/usr/bin/composer"
            if [ ! -x "$COMPOSER_BIN" ]; then
              COMPOSER_BIN="$(command -v composer)"
            fi
            COMPOSER_ALLOW_SUPERUSER=1 "$PHP_BIN" "$COMPOSER_BIN" install --no-dev --no-interaction --optimize-autoloader
            # Un dossier filesystem public/atak court-circuite la route PHP /atak
            # (nginx : 301 vers /atak/ puis 403 Ubuntu). Ce n’est pas un asset versionné.
            if [ -d public/atak ] && [ ! -e public/atak/index.php ]; then
              echo "Removing stray public/atak directory (conflicts with /atak route)"
              rm -rf public/atak
            fi
            chown -R www-data:www-data storage
            if [ -d public/uploads ]; then
              chown -R www-data:www-data public/uploads
            fi
            if command -v systemctl >/dev/null 2>&1; then
              systemctl reload php8.4-fpm 2>/dev/null || systemctl reload php-fpm 2>/dev/null || true
            fi
            if [ -f /etc/nginx/sites-available/athena.ttrd.fr ]; then
              if ! grep -q 'location = /atak' /etc/nginx/sites-available/athena.ttrd.fr; then
                echo "NOTE: ajouter le bloc location = /atak depuis docs/nginx.example.conf puis nginx -t && systemctl reload nginx"
              fi
            fi
