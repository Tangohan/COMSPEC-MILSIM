name: Discord changelog

# Annonce sur Discord chaque mise à jour livrée (PR fusionnée sur main ou release
# publiée), sans lien GitHub. La carte reprend seulement le « Résumé joueur »
# de la version dans CHANGELOG-ATAK.md (règle en tête de ce fichier). Le webhook est le secret DISCORD_RELEASES_WEBHOOK.
# Pour ne pas annoncer une PR : label « discord:skip » ou « [skip discord] » dans le titre.
# Une seule annonce par version : les PR fusionnées par un regroupement et les entrées
# du journal déjà présentes avant la fusion ne sont pas reprises (voir le script).

on:
  pull_request:
    types: [closed]
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  announce:
    if: github.event_name == 'release' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          sparse-checkout: |
            .github/scripts
            CHANGELOG-ATAK.md
          sparse-checkout-cone-mode: false
          filter: blob:none
      - name: Fetch main history (one announcement per version)
        run: git fetch --no-tags --filter=blob:none --depth=300 origin "+refs/heads/main:refs/remotes/origin/main"
      - name: Post to Discord
        env:
          DISCORD_RELEASES_WEBHOOK: ${{ secrets.DISCORD_RELEASES_WEBHOOK }}
        run: python3 .github/scripts/discord_changelog.py
