name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_mysql
          coverage: none
      - name: Composer install
        run: composer install --no-interaction --prefer-dist
      - name: Composer audit
        run: composer audit --no-interaction
      - name: PHPUnit
        run: vendor/bin/phpunit
      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=1G

  # L’annuaire des comptes sur un vrai serveur : SQLite accepte des requêtes que MySQL ou MariaDB refusent.
  mysql-directory:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["mysql:8.0", "mariadb:10.11"]
    services:
      db:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: comspec_test
        ports:
          - 3306:3306
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_mysql
          coverage: none
      - name: Composer install
        run: composer install --no-interaction --prefer-dist
      - name: Attendre la base
        run: timeout 150 bash -c 'until mysqladmin ping -h 127.0.0.1 -uroot -proot --silent; do sleep 2; done'
      - name: PHPUnit (annuaire des comptes)
        env:
          COMSPEC_TEST_MYSQL_DSN: "mysql:host=127.0.0.1;port=3306;dbname=comspec_test;charset=utf8mb4"
          COMSPEC_TEST_MYSQL_USER: root
          COMSPEC_TEST_MYSQL_PASS: root
        run: vendor/bin/phpunit --filter PlatformUsersDirectoryMysqlTest

  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: npm ci
        run: npm ci
      - name: Build Tailwind
        run: npm run build:tailwind

  companion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bots/athena-companion/requirements.txt
      - name: Install Companion dependencies
        run: python -m pip install -r bots/athena-companion/requirements.txt
      - name: Test Companion without Discord connection
        run: python -m unittest discover -s bots/athena-companion -p 'test_*.py'
