<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enlistment</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Orbitron:wght@500;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="form-shell">
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="index.html">
        <div class="brand-mark"><span>ENL</span></div>
        <div class="brand-copy">
          <strong>SOAC Enlistment Intake</strong>
          <span>Recruit Application Portal</span>
        </div>
      </a>
      <nav class="nav">
        <a href="index.html">Landing</a>
        <a href="comspec-login.html">COMSPEC Login</a>
        <a href="dashboard.html">Dashboard</a>
      </nav>
    </div>
  </header>

  <main class="section">
    <div class="container" style="max-width:980px;">
      <div class="kicker">Enlistment</div>
      <h1 class="page-title">Join the Program</h1>
      <p class="section-copy">Static demo form for initial recruit registration. Submission creates a simulated personnel file and sets status to RECRUIT — PENDING REVIEW.</p>

      <section class="panel" style="padding:1.5rem; margin-top:1.5rem;">
        <form class="form-grid" data-enlistment-form>
          <div class="grid-2">
            <div class="field"><label for="last-name">Last Name</label><input id="last-name" type="text" required></div>
            <div class="field"><label for="first-name">First Name</label><input id="first-name" type="text" required></div>
          </div>
          <div class="grid-2">
            <div class="field"><label for="callsign">Callsign</label><input id="callsign" type="text"></div>
            <div class="field"><label for="country">Country</label><input id="country" type="text"></div>
          </div>
          <div class="grid-2">
            <div class="field"><label for="experience">MILSIM Experience</label><select id="experience"><option>Beginner</option><option>Intermediate</option><option>Advanced</option><option>Instructor</option></select></div>
            <div class="field"><label for="specialty">Specialty</label><select id="specialty"><option>Pilot</option><option>Crew Chief</option><option>Special Operator</option><option>JTAC / Liaison</option></select></div>
          </div>
          <div class="grid-2">
            <div class="field"><label for="platform">Platform Used</label><input id="platform" type="text" placeholder="ARMA 3 / DCS / Other"></div>
            <div class="field"><label for="availability">Availability</label><input id="availability" type="text" placeholder="Weekdays / Weekends / Evenings"></div>
          </div>
          <div class="field"><label for="notes">Operational Notes</label><textarea id="notes" placeholder="Aviation background, unit history, preferred role, training expectations"></textarea></div>
          <button class="button" type="submit">Submit Enlistment Request</button>
        </form>
        <div data-enlistment-result style="margin-top:1rem;"></div>
      </section>
    </div>
  </main>
  <script src="assets/js/app.js"></script>
</body>
</html>
